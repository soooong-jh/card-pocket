<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CARD POCKET - 결제 실패</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 40px 25px;
      text-align: center;
      box-shadow:
        0 5px 25px rgba(0,0,0,0.08);
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #eee;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    .message {
      color: #666;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .error-box {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 25px;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label {
      color: #888;
    }

    .value {
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }

    button {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 16px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="box">

    <div class="icon">
      !
    </div>

    <h1>
      결제에 실패했습니다
    </h1>

    <p class="message">
      결제가 정상적으로 완료되지 않았습니다.<br>
      아래 내용을 확인해주세요.
    </p>

    <div
      class="error-box"
      id="errorBox"
    >
      확인 중...
    </div>

    <button
      onclick="location.href='/'"
    >
      쇼핑몰로 돌아가기
    </button>

  </div>

</div>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const code =
  params.get("code");

const message =
  params.get("message");

const orderId =
  params.get("orderId");

const errorBox =
  document.getElementById("errorBox");

errorBox.innerHTML = `

  <div class="row">

    <span class="label">
      오류코드
    </span>

    <span class="value">
      ${escapeHtml(code || "알 수 없음")}
    </span>

  </div>

  <div class="row">

    <span class="label">
      오류내용
    </span>

    <span class="value">
      ${escapeHtml(
        message ||
        "결제가 취소되었거나 실패했습니다."
      )}
    </span>

  </div>

  ${
    orderId
      ? `
        <div class="row">

          <span class="label">
            주문번호
          </span>

          <span class="value">
            ${escapeHtml(orderId)}
          </span>

        </div>
      `
      : ""
  }

`;


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
