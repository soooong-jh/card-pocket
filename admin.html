<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CARD POCKET 관리자</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .login-box,
    .admin-box {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .login-box {
      max-width: 420px;
      margin: 70px auto;
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-bar button {
      width: auto;
      padding: 10px 16px;
      margin: 0;
    }

    .order {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      background: #fff;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .order-number {
      font-size: 18px;
      font-weight: bold;
    }

    .order-info {
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .items {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .status-box {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 15px;
    }

    .status-box select {
      margin: 0;
      flex: 1;
    }

    .status-box button {
      width: auto;
      margin: 0;
      white-space: nowrap;
    }

    .shipping-box {
      margin-top: 20px;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 10px;
    }

    .shipping-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .shipping-inputs {
      display: flex;
      gap: 10px;
    }

    .shipping-inputs select {
      flex: 0 0 180px;
      margin-top: 0;
    }

    .shipping-inputs input {
      flex: 1;
      margin-top: 0;
    }

    .shipping-button {
      margin-top: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .error {
      background: #fff0f0;
      color: #c00;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success {
      background: #effaf0;
      color: #187a1f;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 0 10px;
      }

      .order-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .status-box {
        flex-direction: column;
        align-items: stretch;
      }

      .status-box button {
        width: 100%;
      }

      .shipping-inputs {
        flex-direction: column;
      }

      .shipping-inputs select {
        width: 100%;
        flex: none;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>CARD POCKET 관리자</h1>
</header>

<div class="container">

  <!-- 로그인 -->

  <div id="loginArea" class="login-box">

    <h2>관리자 로그인</h2>

    <p style="color:#777;">
      관리자 비밀번호를 입력해주세요.
    </p>

    <input
      type="password"
      id="adminPassword"
      placeholder="관리자 비밀번호"
      onkeydown="if(event.key === 'Enter') login()"
    >

    <button onclick="login()">
      로그인
    </button>

    <p
      id="loginError"
      style="color:#d00;display:none;margin-top:15px;"
    >
      비밀번호가 올바르지 않습니다.
    </p>

  </div>


  <!-- 관리자 -->

  <div id="adminArea" class="admin-box" style="display:none;">

    <div class="top-bar">

      <div>

        <h2 style="margin-bottom:5px;">
          주문 관리
        </h2>

        <span
          id="orderCount"
          style="color:#777;"
        >
          주문을 불러오는 중...
        </span>

      </div>

      <button onclick="loadOrders()">
        새로고침
      </button>

    </div>

    <div id="message"></div>

    <div id="orders">

      <div class="loading">
        주문을 불러오는 중...
      </div>

    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://liyjjunpwexsqvmrdeas.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_9NwuhkCzUm9xwgr_OrdeDA_4rpIsND5";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const ADMIN_PASSWORD =
    "cardpocket";


  /* ================================
     로그인
  ================================= */

  function login() {

    const password =
      document.getElementById(
        "adminPassword"
      ).value;

    const error =
      document.getElementById(
        "loginError"
      );

    if (password === ADMIN_PASSWORD) {

      error.style.display = "none";

      document.getElementById(
        "loginArea"
      ).style.display = "none";

      document.getElementById(
        "adminArea"
      ).style.display = "block";

      loadOrders();

    } else {

      error.style.display = "block";

    }

  }


  /* ================================
     주문 불러오기
  ================================= */

  async function loadOrders() {

    const ordersElement =
      document.getElementById(
        "orders"
      );

    const countElement =
      document.getElementById(
        "orderCount"
      );

    const messageElement =
      document.getElementById(
        "message"
      );

    ordersElement.innerHTML =
      '<div class="loading">주문을 불러오는 중...</div>';

    messageElement.innerHTML = "";

    try {

      const { data, error } =
        await supabaseClient
          .from("orders")
          .select("*")
          .order("created_at", {
            ascending: false
          });

      if (error) {
        throw error;
      }

      countElement.textContent =
        `총 ${data.length}건의 주문`;

      if (!data || data.length === 0) {

        ordersElement.innerHTML =
          '<div class="empty">아직 주문이 없습니다.</div>';

        return;
      }

      ordersElement.innerHTML =
        data
          .map(order =>
            createOrderHTML(order)
          )
          .join("");

    } catch (error) {

      console.error(error);

      countElement.textContent =
        "주문을 불러오지 못했습니다.";

      messageElement.innerHTML = `
        <div class="error">
          주문을 불러오지 못했습니다.<br>
          ${escapeHtml(
            error.message || ""
          )}
        </div>
      `;

      ordersElement.innerHTML = "";

    }

  }


  /* ================================
     주문 HTML
  ================================= */

  function createOrderHTML(order) {

    const itemsText =
      formatItems(order.items);

    const createdAt =
      order.created_at
        ? new Date(
            order.created_at
          ).toLocaleString("ko-KR")
        : "-";


    return `

      <div class="order">

        <div class="order-header">

          <div>

            <div class="order-number">
              주문번호
              ${escapeHtml(
                order.order_number || "-"
              )}
            </div>

            <div
              style="color:#777;margin-top:5px;"
            >
              ${createdAt}
            </div>

          </div>

          <div class="price">
            ${Number(
              order.total_price || 0
            ).toLocaleString()}원
          </div>

        </div>


        <div class="order-info">

          <strong>구매자</strong><br>

          ${escapeHtml(
            order.buyer_name || "-"
          )}

          <br><br>

          <strong>전화번호</strong><br>

          ${escapeHtml(
            order.buyer_phone || "-"
          )}

          <br><br>

          <strong>주소</strong><br>

          ${escapeHtml(
            order.buyer_address || "-"
          )}

        </div>


        <strong>주문 상품</strong>

        <div class="items">
          ${escapeHtml(itemsText)}
        </div>


        <!-- 주문 상태 -->

        <strong>
          주문 상태
        </strong>

        <div class="status-box">

          <select
            id="status-${order.id}"
          >

            ${statusOption(
              "결제대기",
              order.status
            )}

            ${statusOption(
              "결제완료",
              order.status
            )}

            ${statusOption(
              "배송준비",
              order.status
            )}

            ${statusOption(
              "배송중",
              order.status
            )}

            ${statusOption(
              "배송완료",
              order.status
            )}

            ${statusOption(
              "주문취소",
              order.status
            )}

          </select>

          <button
            onclick="updateStatus('${order.id}')"
          >
            상태 저장
          </button>

        </div>


        <!-- 배송 정보 -->

        <div class="shipping-box">

          <div class="shipping-title">
            🚚 배송 정보
          </div>

          <div class="shipping-inputs">

            <select
              id="courier-${order.id}"
            >

              <option value="">
                택배사 선택
              </option>

              <option
                value="CJ대한통운"
                ${order.courier === "CJ대한통운"
                  ? "selected"
                  : ""}
              >
                CJ대한통운
              </option>

              <option
                value="한진택배"
                ${order.courier === "한진택배"
                  ? "selected"
                  : ""}
              >
                한진택배
              </option>

              <option
                value="롯데택배"
                ${order.courier === "롯데택배"
                  ? "selected"
                  : ""}
              >
                롯데택배
              </option>

              <option
                value="우체국택배"
                ${order.courier === "우체국택배"
                  ? "selected"
                  : ""}
              >
                우체국택배
              </option>

              <option
                value="로젠택배"
                ${order.courier === "로젠택배"
                  ? "selected"
                  : ""}
              >
                로젠택배
              </option>

              <option
                value="GS25 반값택배"
                ${order.courier === "GS25 반값택배"
                  ? "selected"
                  : ""}
              >
                GS25 반값택배
              </option>

              <option
                value="CU 반값택배"
                ${order.courier === "CU 반값택배"
                  ? "selected"
                  : ""}
              >
                CU 반값택배
              </option>

              <option
                value="기타"
                ${order.courier === "기타"
                  ? "selected"
                  : ""}
              >
                기타
              </option>

            </select>


            <input
              type="text"
              id="tracking-${order.id}"
              value="${escapeHtml(
                order.tracking_number || ""
              )}"
              placeholder="운송장번호 입력"
            >

          </div>


          <button
            class="shipping-button"
            onclick="updateShipping('${order.id}')"
          >
            배송정보 저장
          </button>

        </div>


      </div>

    `;

  }


  /* ================================
     상태 옵션
  ================================= */

  function statusOption(
    value,
    current
  ) {

    return `

      <option
        value="${value}"
        ${
          current === value
            ? "selected"
            : ""
        }
      >
        ${value}
      </option>

    `;

  }


  /* ================================
     주문 상태 변경
  ================================= */

  async function updateStatus(
    orderId
  ) {

    const select =
      document.getElementById(
        `status-${orderId}`
      );

    const newStatus =
      select.value;

    try {

      const { error } =
        await supabaseClient
          .from("orders")
          .update({
            status: newStatus
          })
          .eq("id", orderId);

      if (error) {
        throw error;
      }

      alert(
        "주문 상태가 변경되었습니다."
      );

      loadOrders();

    } catch (error) {

      console.error(error);

      alert(
        "상태 변경에 실패했습니다.\n\n" +
        error.message
      );

    }

  }


  /* ================================
     배송정보 저장
  ================================= */

  async function updateShipping(
    orderId
  ) {

    const courier =
      document.getElementById(
        `courier-${orderId}`
      ).value;

    const trackingNumber =
      document.getElementById(
        `tracking-${orderId}`
      ).value.trim();


    if (!courier) {

      alert(
        "택배사를 선택해주세요."
      );

      return;

    }


    if (!trackingNumber) {

      alert(
        "운송장번호를 입력해주세요."
      );

      return;

    }


    try {

      const { error } =
        await supabaseClient
          .from("orders")
          .update({

            courier:
              courier,

            tracking_number:
              trackingNumber,

            status:
              "배송중"

          })
          .eq("id", orderId);


      if (error) {
        throw error;
      }


      alert(
        "배송정보가 저장되었습니다."
      );


      loadOrders();


    } catch (error) {

      console.error(error);

      alert(
        "배송정보 저장에 실패했습니다.\n\n" +
        error.message
      );

    }

  }


  /* ================================
     주문 상품 표시
  ================================= */

  function formatItems(items) {

    if (!items) {
      return "-";
    }


    if (typeof items === "string") {

      try {

        items =
          JSON.parse(items);

      } catch {

        return items;

      }

    }


    if (Array.isArray(items)) {

      return items
        .map(item => {

          const name =
            item.name ||
            item.product_name ||
            "상품";

          const quantity =
            item.quantity ||
            item.qty ||
            1;

          return `${name} × ${quantity}`;

        })
        .join("\n");

    }


    if (
      typeof items === "object"
    ) {

      return JSON.stringify(
        items,
        null,
        2
      );

    }


    return String(items);

  }


  /* ================================
     HTML 보안 처리
  ================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
</html>
