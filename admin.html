
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARD POCKET 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #111;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .login-box, .admin-box {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }
    .login-box {
      max-width: 420px;
      margin: 70px auto;
    }
    h2 { margin-top: 0; }
    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }
    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .top-bar button {
      width: auto;
      padding: 10px 16px;
      margin: 0;
    }
    .order {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      background: white;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .order-number { font-size: 18px; font-weight: bold; }
    .order-info { line-height: 1.8; margin-bottom: 15px; }
    .items {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }
    .status-box {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 15px;
    }
    .status-box select { margin: 0; flex: 1; }
    .status-box button {
      width: auto;
      margin: 0;
      white-space: nowrap;
    }
    .shipping-box {
      margin-top: 20px;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 10px;
    }
    .shipping-title { font-weight: bold; margin-bottom: 8px; }
    .shipping-inputs { display: flex; gap: 10px; }
    .shipping-inputs select {
      flex: 0 0 180px;
      margin-top: 0;
    }
    .shipping-inputs input { flex: 1; margin-top: 0; }
    .shipping-button { margin-top: 10px; }
    .detail-button {
      background: #444;
      margin-top: 15px;
    }
    .delete-button {
      background: #c62828;
      margin-top: 10px;
    }
    .price { font-size: 18px; font-weight: bold; }
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #777;
    }
    .loading { text-align: center; padding: 40px; }
    .error {
      background: #fff0f0;
      color: #c00;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      overflow-wrap: anywhere;
    }
    .success {
      background: #effaf0;
      color: #176b2c;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }
    .modal {
      background: white;
      max-width: 600px;
      margin: 40px auto;
      border-radius: 16px;
      padding: 25px;
      position: relative;
    }
    .modal h2 { margin-bottom: 20px; }
    .close-button {
      position: absolute;
      right: 18px;
      top: 15px;
      width: 40px;
      height: 40px;
      padding: 0;
      margin: 0;
      background: transparent;
      color: #222;
      font-size: 28px;
    }
    .detail-row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.6;
    }
    .detail-label { color: #777; font-size: 13px; margin-bottom: 3px; }
    .detail-value { font-size: 15px; word-break: break-all; }
    .detail-items {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .container { padding: 0 10px; }
      .order-header {
        align-items: flex-start;
        flex-direction: column;
      }
      .status-box {
        flex-direction: column;
        align-items: stretch;
      }
      .status-box button { width: 100%; }
      .shipping-inputs { flex-direction: column; }
      .shipping-inputs select { width: 100%; flex: none; }
      .modal { margin: 10px auto; }
    }
  </style>
</head>

<body>
<header>
  <h1>CARD POCKET 관리자</h1>
</header>

<div class="container">
  <div id="loginArea" class="login-box">
    <h2>관리자 로그인</h2>
    <p style="color:#777;">관리자 비밀번호를 입력해주세요.</p>
    <input
      type="password"
      id="adminPassword"
      placeholder="관리자 비밀번호"
      onkeydown="if(event.key === 'Enter') login()"
    >
    <button onclick="login()">로그인</button>
    <p id="loginError" style="color:#d00;display:none;margin-top:15px;">
      비밀번호가 올바르지 않습니다.
    </p>
  </div>

  <div id="adminArea" class="admin-box" style="display:none;">
    <div class="top-bar">
      <div>
        <h2 style="margin-bottom:5px;">주문 관리</h2>
        <span id="orderCount" style="color:#777;">주문을 불러오는 중...</span>
      </div>
      <button onclick="loadOrders()">새로고침</button>
    </div>
    <div id="message"></div>
    <div id="orders">
      <div class="loading">주문을 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 주문 상세보기 모달 -->
<div id="detailModal" class="modal-bg" onclick="closeModalOutside(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-button" onclick="closeDetailModal()">×</button>
    <h2>주문 상세보기</h2>
    <div id="detailContent"></div>
  </div>
</div>

<script>
  const SUPABASE_URL =
    "https://liyjjunpwexsqvmrdeas.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_9NwuhkCzUm9xwgr_OrdeDA_4rpIsND5";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const ADMIN_PASSWORD = "cardpocket";
  let ordersData = [];

  /* 로그인 */
  function login() {
    const password = document.getElementById("adminPassword").value;
    const error = document.getElementById("loginError");

    if (password === ADMIN_PASSWORD) {
      error.style.display = "none";
      document.getElementById("loginArea").style.display = "none";
      document.getElementById("adminArea").style.display = "block";
      loadOrders();
    } else {
      error.style.display = "block";
    }
  }

  /* 메시지 표시 */
  function showMessage(message, type = "success") {
    const element = document.getElementById("message");
    element.className = type;
    element.textContent = message;
  }

  /* 주문 불러오기 */
  async function loadOrders() {
    const ordersElement = document.getElementById("orders");
    const countElement = document.getElementById("orderCount");
    const messageElement = document.getElementById("message");

    ordersElement.innerHTML =
      '<div class="loading">주문을 불러오는 중...</div>';
    messageElement.innerHTML = "";
    messageElement.className = "";

    try {
      const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) throw error;

      ordersData = data || [];
      countElement.textContent = `총 ${ordersData.length}건의 주문`;

      if (ordersData.length === 0) {
        ordersElement.innerHTML =
          '<div class="empty">아직 주문이 없습니다.</div>';
        return;
      }

      ordersElement.innerHTML = ordersData
        .map(order => createOrderHTML(order))
        .join("");
    } catch (error) {
      console.error(error);
      countElement.textContent = "주문을 불러오지 못했습니다.";
      ordersElement.innerHTML = "";
      showMessage(
        "주문을 불러오지 못했습니다. " + (error.message || ""),
        "error"
      );
    }
  }

  /* 주문 카드 */
  function createOrderHTML(order) {
    const itemsText = formatItems(order.items);
    const createdAt = order.created_at
      ? new Date(order.created_at).toLocaleString("ko-KR")
      : "-";

    return `
      <div class="order">
        <div class="order-header">
          <div>
            <div class="order-number">
              주문번호 ${escapeHtml(order.order_number || "-")}
            </div>
            <div style="color:#777;margin-top:5px;">
              ${escapeHtml(createdAt)}
            </div>
          </div>
          <div class="price">
            ${Number(order.total_price || 0).toLocaleString()}원
          </div>
        </div>

        <div class="order-info">
          <strong>구매자</strong><br>
          ${escapeHtml(order.buyer_name || "-")}<br><br>
          <strong>전화번호</strong><br>
          ${escapeHtml(order.buyer_phone || "-")}<br><br>
          <strong>주소</strong><br>
          ${escapeHtml(order.buyer_address || "-")}
        </div>

        <strong>주문 상품</strong>
        <div class="items">${escapeHtml(itemsText)}</div>

        <strong>주문 상태</strong>
        <div class="status-box">
          <select id="status-${escapeHtml(order.id)}">
            ${statusOption("결제대기", order.status)}
            ${statusOption("결제완료", order.status)}
            ${statusOption("배송준비", order.status)}
            ${statusOption("배송중", order.status)}
            ${statusOption("배송완료", order.status)}
            ${statusOption("주문취소", order.status)}
          </select>
          <button onclick="updateStatus('${escapeHtml(order.id)}')">
            상태 저장
          </button>
        </div>

        <div class="shipping-box">
          <div class="shipping-title">🚚 배송 정보</div>
          <div class="shipping-inputs">
            <select id="courier-${escapeHtml(order.id)}">
              <option value="">택배사 선택</option>
              ${courierOption("CJ대한통운", order.courier)}
              ${courierOption("한진택배", order.courier)}
              ${courierOption("롯데택배", order.courier)}
              ${courierOption("우체국택배", order.courier)}
              ${courierOption("로젠택배", order.courier)}
              ${courierOption("GS25 반값택배", order.courier)}
              ${courierOption("CU 반값택배", order.courier)}
              ${courierOption("기타", order.courier)}
            </select>
            <input
              type="text"
              id="tracking-${escapeHtml(order.id)}"
              value="${escapeHtml(order.tracking_number || "")}"
              placeholder="운송장번호 입력"
            >
          </div>
          <button
            class="shipping-button"
            onclick="updateShipping('${escapeHtml(order.id)}')"
          >배송정보 저장</button>
        </div>

        <button
          class="detail-button"
          onclick="showOrderDetail('${escapeHtml(order.id)}')"
        >📋 주문 상세보기</button>

        <button
          class="delete-button"
          onclick="deleteOrder('${escapeHtml(order.id)}')"
        >🗑️ 주문 삭제</button>
      </div>
    `;
  }

  function statusOption(value, current) {
    return `
      <option value="${escapeHtml(value)}"
        ${current === value ? "selected" : ""}>
        ${escapeHtml(value)}
      </option>
    `;
  }

  function courierOption(value, current) {
    return `
      <option value="${escapeHtml(value)}"
        ${current === value ? "selected" : ""}>
        ${escapeHtml(value)}
      </option>
    `;
  }

  /* 주문 상태 변경 */
  async function updateStatus(orderId) {
    const select = document.getElementById(`status-${orderId}`);
    if (!select) return;

    try {
      const { error } = await supabaseClient
        .from("orders")
        .update({ status: select.value })
        .eq("id", orderId);

      if (error) throw error;

      alert("주문 상태가 변경되었습니다.");
      await loadOrders();
    } catch (error) {
      console.error(error);
      alert("상태 변경에 실패했습니다.\n\n" + error.message);
    }
  }

  /* 배송정보 저장 */
  async function updateShipping(orderId) {
    const courierElement = document.getElementById(`courier-${orderId}`);
    const trackingElement = document.getElementById(`tracking-${orderId}`);

    if (!courierElement || !trackingElement) return;

    const courier = courierElement.value;
    const trackingNumber = trackingElement.value.trim();

    if (!courier) {
      alert("택배사를 선택해주세요.");
      return;
    }

    if (!trackingNumber) {
      alert("운송장번호를 입력해주세요.");
      return;
    }

    try {
      const { error } = await supabaseClient
        .from("orders")
        .update({
          courier: courier,
          tracking_number: trackingNumber,
          status: "배송중"
        })
        .eq("id", orderId);

      if (error) throw error;

      alert("배송정보가 저장되었습니다.");
      await loadOrders();
    } catch (error) {
      console.error(error);
      alert("배송정보 저장에 실패했습니다.\n\n" + error.message);
    }
  }

  /* 주문 삭제 */
  async function deleteOrder(orderId) {
    const order = ordersData.find(
      item => String(item.id) === String(orderId)
    );

    if (!order) {
      alert("주문 정보를 찾을 수 없습니다. 목록을 새로고침해주세요.");
      return;
    }

    const orderNumber = order.order_number || order.id;
    const buyerName = order.buyer_name || "구매자 정보 없음";

    const confirmed = confirm(
      "정말 이 주문을 삭제할까요?\n\n" +
      "주문번호: " + orderNumber + "\n" +
      "구매자: " + buyerName + "\n\n" +
      "삭제한 주문 기록은 복구하기 어려울 수 있습니다.\n" +
      "결제 취소나 환불은 별도로 처리해야 합니다."
    );

    if (!confirmed) return;

    const buttons = document.querySelectorAll(".delete-button");
    buttons.forEach(button => button.disabled = true);

    try {
      const { data, error } = await supabaseClient
        .from("orders")
        .delete()
        .eq("id", orderId)
        .select("id");

      if (error) throw error;

      if (!data || data.length === 0) {
        throw new Error(
          "주문이 삭제되지 않았습니다. Supabase의 삭제 권한(RLS)을 확인해주세요."
        );
      }

      closeDetailModal();
      await loadOrders();
      showMessage(
        `주문번호 ${orderNumber} 주문이 삭제되었습니다.`,
        "success"
      );
    } catch (error) {
      console.error("주문 삭제 오류:", error);
      alert(
        "주문 삭제에 실패했습니다.\n\n" +
        (error.message || "알 수 없는 오류") +
        "\n\n삭제 권한이 없으면 Supabase 설정 확인이 필요합니다."
      );
      buttons.forEach(button => button.disabled = false);
    }
  }

  /* 주문 상세보기 */
  function showOrderDetail(orderId) {
    const order = ordersData.find(
      item => String(item.id) === String(orderId)
    );

    if (!order) {
      alert("주문 정보를 찾을 수 없습니다.");
      return;
    }

    const createdAt = order.created_at
      ? new Date(order.created_at).toLocaleString("ko-KR")
      : "-";

    const details = [
      ["주문번호", order.order_number || "-"],
      ["주문일시", createdAt],
      ["구매자", order.buyer_name || "-"],
      ["전화번호", order.buyer_phone || "-"],
      ["배송주소", order.buyer_address || "-"],
      ["주문 상품", formatItems(order.items)],
      ["결제금액", Number(order.total_price || 0).toLocaleString() + "원"],
      ["주문 상태", order.status || "-"],
      ["택배사", order.courier || "-"],
      ["운송장번호", order.tracking_number || "-"]
    ];

    document.getElementById("detailContent").innerHTML =
      details.map(([label, value]) => {
        const isItems = label === "주문 상품";
        return `
          <div class="detail-row">
            <div class="detail-label">${escapeHtml(label)}</div>
            <div class="${isItems ? "detail-items" : "detail-value"}">${
              escapeHtml(value)
            }</div>
          </div>
        `;
      }).join("");

    document.getElementById("detailModal").style.display = "block";
  }

  function closeDetailModal() {
    document.getElementById("detailModal").style.display = "none";
  }

  function closeModalOutside(event) {
    if (event.target.id === "detailModal") {
      closeDetailModal();
    }
  }

  /* 주문 상품 표시 */
  function formatItems(items) {
    if (!items) return "-";

    if (typeof items === "string") {
      try {
        items = JSON.parse(items);
      } catch {
        return items;
      }
    }

    if (Array.isArray(items)) {
      return items.map(item => {
        const name = item.name || item.product_name || "상품";
        const quantity = item.quantity || item.qty || 1;
        return `${name} × ${quantity}`;
      }).join("\n");
    }

    if (typeof items === "object") {
      return JSON.stringify(items, null, 2);
    }

    return String(items);
  }

  /* HTML 문자 처리 */
  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
</body>
</html>
